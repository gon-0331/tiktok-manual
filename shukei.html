    <style>
:root{--paper:#F6F3EC;--ink:#221F1A;--dim:#6B6459;--card:#fff;--accent:#C92C3C;--line:rgba(34,31,26,.2)}
@media (prefers-color-scheme:dark){:root{--paper:#15181C;--ink:#EDE9E1;--dim:#9B968B;--card:#1D2126;--accent:#FF6B79;--line:rgba(237,233,225,.2)}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",-apple-system,sans-serif}
#gate{min-height:100svh;display:grid;place-items:center;padding:28px}
.gb{width:100%;max-width:320px;text-align:center}
.gb img{width:84px;height:84px;border-radius:19px;border:1px solid var(--line)}
.gb h1{font-size:19px;margin:18px 0 6px}
.gb p{font-size:13.5px;color:var(--dim);margin:0 0 22px}
.gb input{width:100%;padding:14px;font-size:17px;border:1px solid var(--line);border-radius:12px;
  background:var(--card);color:var(--ink);text-align:center;font-family:inherit}
.gb button{width:100%;margin-top:11px;padding:14px;font-size:16px;border:0;border-radius:12px;
  background:var(--accent);color:#fff;font-family:inherit;font-weight:700;cursor:pointer}
.gb .er{color:var(--accent);font-size:13px;margin-top:13px}
</style></head><body>

function initShukei(){
"use strict";
/* ============================================================
   ハチミツ実績ツール
   部屋（Discord）に報告された「その日に何回踏んだか」を、
   日付×会員の表として持つだけの単純な作り。
   データはこのブラウザの中だけに残る。
   ============================================================ */
var KEY = "hachimitsu-jisseki-v1";

function blank(){ return { members:[], counts:{}, prize:35000, from:"", to:"", webhook:"" }; }
var S = loadData();

function loadData(){
  try{
    var r = JSON.parse(localStorage.getItem(KEY) || "null");
    if (r && Array.isArray(r.members)){
      var b = blank();
      for (var k in b) if (!(k in r)) r[k] = b[k];
      if (!r.counts || typeof r.counts !== "object") r.counts = {};
      return r;
    }
  }catch(e){}
  return blank();
}
function save(){
  S.updated = new Date().toISOString();
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ toast("保存できませんでした"); }
}

function $(s){ return document.querySelector(s); }
function $$(s){ return Array.prototype.slice.call(document.querySelectorAll(s)); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function pad2(n){ return ("0"+n).slice(-2); }
function ymd(d){ return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function today(){ return ymd(new Date()); }

/* その日・その人の回数 */
function getCount(day, mid){

function setCount(day, mid, n){
  n = Math.max(0, Math.min(999, parseInt(n,10) || 0));
  if (!S.counts[day]) S.counts[day] = {};
  if (n === 0) delete S.counts[day][mid]; else S.counts[day][mid] = n;
  if (!Object.keys(S.counts[day]).length) delete S.counts[day];
  save();
}

   貼り付けて読み取る
   ============================================================ */
/* 時刻・日付を落としてから数字を探す。「◯回」があればそれを優先する */
function numberIn(line){
  var t = String(line)
    .replace(/\d{1,2}:\d{2}(:\d{2})?/g, " ")
    .replace(/\d{4}\s*[\/\-年]\s*\d{1,2}\s*[\/\-月]\s*\d{1,2}\s*日?/g, " ")
    .replace(/\d{1,2}\s*[\/\-]\s*\d{1,2}/g, " ")
    .replace(/\d{1,2}\s*月\s*\d{1,2}\s*日/g, " ");
  var kai = t.match(/(\d+)\s*回/);
  if (kai) return parseInt(kai[1], 10);
  /* 「回」が無いときは、数字だけの行に限って拾う。
     「今日は3時間やった」のような文章から数字を拾わないため。 */
  var only = t.replace(/[\s　。、．，!！?？:：~〜ー・\-]/g, "");
  if (/^\d+(です|でーす|だよ)?$/.test(only)) return parseInt(only, 10);
  return null;
}
/* 行の中に登録名が含まれていればその会員。長い名前から先に見る */
function memberIn(line){
  var hit = null, len = -1;
  S.members.forEach(function(m){
    if (m.name && line.indexOf(m.name) >= 0 && m.name.length > len){ hit = m; len = m.name.length; }
  });
  return hit;
}

function parseText(text){
  var lines = String(text||"").split(/\r?\n/).map(function(s){ return s.trim(); }).filter(Boolean);
  var found = {}, order = [], cur = null;
  lines.forEach(function(ln){
    var m = memberIn(ln);
    if (m) cur = m;
    var n = numberIn(ln);
    if (cur && n !== null){
      if (!(cur.id in found)) order.push(cur.id);
      found[cur.id] = n;   /* 同じ人が複数行に出たら後のほうを採る */
      cur = null;
    }
  });
  return order.map(function(id){ return { mid:id, n:found[id] }; });
}

/* ============================================================
   集計
   ============================================================ */
function inRange(day){
  var f = $("#fDate").value, t = $("#tDate").value;
  if (f && day < f) return false;
  if (t && day > t) return false;
  return true;
}
function days(){ return Object.keys(S.counts).filter(inRange).sort().reverse(); }
function allDays(){ return Object.keys(S.counts).sort(); }

function tally(){
  var by = {}, total = 0;
  days().forEach(function(day){
    var d = S.counts[day];
    for (var mid in d){
      by[mid] = (by[mid] || 0) + d[mid];
      total += d[mid];
    }
  });
  var list = S.members.map(function(m){ return { mid:m.id, n: by[m.id] || 0 }; })
                      .filter(function(x){ return x.n > 0; });
  /* 名簿から消えた人の記録も拾う */
  for (var mid in by) if (!findMember(mid)) list.push({ mid:mid, n:by[mid] });
  list.sort(function(a,b){ return b.n - a.n; });
  return { list:list, total:total };
}

    + '</tbody></table></div>';

/* ============================================================
   報告文
   ============================================================ */
function rangeLabel(){
  var f = $("#fDate").value, t = $("#tDate").value;
  if (!f && !t) return "全期間";
  return (f || "はじめ") + "〜" + (t || "今日");
}
function jpDate(d){
  var a = String(d||"").split("-");
  if (a.length !== 3) return d;
  return a[0] + "年" + Number(a[1]) + "月" + Number(a[2]) + "日";
}
function reportText(){
  var day = $("#rDate").value || today();
  var out = ["【ハチミツ実績】" + jpDate(day), ""];

  var d = S.counts[day] || {};
  var dayList = Object.keys(d).map(function(mid){ return { mid:mid, n:d[mid] }; })
                              .sort(function(a,b){ return b.n - a.n; });
  out.push("■ この日");
  if (!dayList.length) out.push("　報告はありません");
  else dayList.forEach(function(x){
    out.push("　" + memberLabel(x.mid) + "　" + num(x.n) + "回");
  });
  out.push("　この日の合計 " + num(dayList.reduce(function(a,x){ return a + x.n; }, 0)) + "回");
  out.push("");

  var t = tally();
  out.push("■ 累計（" + rangeLabel() + "）");
  if (!t.list.length) out.push("　記録はありません");
  else t.list.forEach(function(x){
    out.push("　" + memberLabel(x.mid) + "　" + num(x.n) + "回　"
             + (t.total ? (x.n / t.total * 100).toFixed(1) : "0.0") + "%");
  });
  out.push("　累計の合計 " + num(t.total) + "回");
  out.push("");
  out.push("※ 分配は踏んでもらった回数で山分けします。");
  return out.join("\n");
}

function copy(text, msg){
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ toast(msg); },
      function(){ fallbackCopy(text, msg); });
  } else fallbackCopy(text, msg);
}
function fallbackCopy(text, msg){
  var ta=document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); toast(msg); }catch(e){ toast("コピーできませんでした"); }
  document.body.removeChild(ta);
}

/* Discordのcontentは2000文字まで。長い報告は行で切って分けて送る。 */
function splitForDiscord(text, limit){
  var out = [], cur = "";
  text.split("\n").forEach(function(line){
    if ((cur + line + "\n").length > limit){ if (cur) out.push(cur); cur = ""; }
    cur += line + "\n";
  });
  if (cur.trim()) out.push(cur);
  return out;
}

async function postToDiscord(){
  var url = (S.webhook || "").trim();
  if (!/^https:\/\/(discord|discordapp)\.com\/api\/webhooks\//.test(url)){
    toast("Webhookのアドレスを入れてください"); return;
  }
  if (!allDays().length){ toast("まだ記録がありません"); return; }
  var text = reportText();
  if (!confirm("この内容をDiscordの部屋に投稿します。よろしいですか？\n\n" + text.slice(0, 300) + "…")) return;

  var btn = $("#postDiscord");
  btn.disabled = true; btn.textContent = "送っています…";
  try{
    var parts = splitForDiscord(text, 1900);
    for (var i = 0; i < parts.length; i++){
      var r = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ content: parts[i] })
      });
      if (!(r.ok || r.status === 204)){
        toast("投稿できませんでした（" + r.status + "）");
        return;
      }
    }
    toast(parts.length > 1 ? parts.length + "通に分けて投稿しました" : "部屋に投稿しました");
  }catch(e){
    toast("投稿できませんでした（通信エラー）");
  }finally{
    btn.disabled = false; btn.textContent = "部屋に投稿する";
  }
}

function download(name, text, type){
  var blob = new Blob([text], { type: type||"text/plain;charset=utf-8" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); document.body.removeChild(a); }, 500);
}

    try{
      var r = JSON.parse(rd.result);
      if (!r || !Array.isArray(r.members)) throw new Error("形式が違います");
      if (!confirm("いまのデータを置き換えます。よろしいですか？")) return;
      S = Object.assign(blank(), r); save(); applyState(); renderAll(); toast("読み込みました");
    }catch(e){ toast("読み込めませんでした"); }
  };
  rd.readAsText(f); this.value="";
});
$("#expCsv").addEventListener("click", function(){
  var r = tally(), ds = days();
  var rows = [["会員","回数","割合%"]];
  r.list.forEach(function(x){ rows.push([memberLabel(x.mid), x.n, (x.n/r.total*100).toFixed(1)]); });
  rows.push(["合計", r.total, "100.0"]);
  rows.push([]);
  rows.push(["日ごとの回数"]);
  rows.push(["日付"].concat(r.list.map(function(x){ return memberLabel(x.mid); })).concat(["合計"]));
  ds.forEach(function(day){
    var sum = 0;
    var line = [day].concat(r.list.map(function(x){ var v=getCount(day,x.mid); sum+=v; return v; }));
    line.push(sum); rows.push(line);
  });
  var csv = "﻿" + rows.map(function(a){
    return a.map(function(c){ return '"'+String(c).replace(/"/g,'""')+'"'; }).join(",");
  }).join("\r\n");
  download("ハチミツ実績_"+today()+".csv", csv, "text/csv;charset=utf-8");
  toast("CSVを保存しました");
});
$("#clearAll").addEventListener("click", function(){
  if (!confirm("名簿も記録もすべて消えます。先に書き出しておくことをおすすめします。よろしいですか？")) return;
  S = blank(); save(); applyState(); renderAll(); toast("ぜんぶ消しました");
});

function applyState(){
  $("#fDate").value = S.from || "";
  $("#tDate").value = S.to || "";
  $("#prize").value = S.prize || 0;
  $("#dDate").value = today();

}
applyState();
renderAll();

    (function(){
      var inp=document.getElementById('pw'), btn=document.getElementById('go'), er=document.getElementById('er');
      var opening=false;
      async function tryPw(pw, remember){
        if(opening) return;
        opening=true; btn.disabled=true;
        er.hidden=true; btn.textContent='開いています…';
        try{ await unlock(pw); if(remember){ try{ localStorage.setItem('tl-pw',pw); }catch(e){} } }
        catch(e){ btn.textContent='開く'; er.hidden=false; inp.value=''; inp.focus();
          try{ localStorage.removeItem('tl-pw'); }catch(x){} }
        finally{ opening=false; btn.disabled=false; }
      }
      btn.onclick=function(){ tryPw(inp.value.replace(/[【】\s]/g,'').toLowerCase(), true); };
      inp.addEventListener('keydown',function(e){ if(e.key==='Enter') btn.click(); });
      var saved=null; try{ saved=localStorage.getItem('tl-pw'); }catch(e){}
      if(saved) tryPw(saved,false); else inp.focus();
    })();
    </script></body></html>
