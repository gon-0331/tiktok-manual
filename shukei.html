<style>
:root{--paper:#F6F3EC;--ink:#221F1A;--dim:#6B6459;--card:#fff;--accent:#C92C3C;--line:rgba(34,31,26,.2)}
@media (prefers-color-scheme:dark){:root{--paper:#15181C;--ink:#EDE9E1;--dim:#9B968B;--card:#1D2126;--accent:#FF6B79;--line:rgba(237,233,225,.2)}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",-apple-system,sans-serif}
#gate{min-height:100svh;display:grid;place-items:center;padding:28px}
.gb{width:100%;max-width:320px;text-align:center}
.gb img{width:84px;height:84px;border-radius:19px;border:1px solid var(--line)}
.gb h1{font-size:19px;margin:18px 0 6px}
.gb p{font-size:13.5px;color:var(--dim);margin:0 0 22px}
.gb input{width:100%;padding:14px;font-size:17px;border:1px solid var(--line);border-radius:12px;
  background:var(--card);color:var(--ink);text-align:center;font-family:inherit}
.gb button{width:100%;margin-top:11px;padding:14px;font-size:16px;border:0;border-radius:12px;
  background:var(--accent);color:#fff;font-family:inherit;font-weight:700;cursor:pointer}
.gb .er{color:var(--accent);font-size:13px;margin-top:13px}
</style></head><body>

function d64(x){var s=atob(x),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
async function unlock(pw){
  var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  var k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:d64(P.s),iterations:150000,hash:'SHA-256'},
        km,{name:'AES-GCM',length:256},false,['decrypt']);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:d64(P.i)},k,d64(P.d));
  document.getElementById('app').innerHTML=new TextDecoder().decode(pt);
  document.getElementById('gate').remove();
  initShukei();
}

function initShukei(){
"use strict";
/* ============================================================
   データの置き場所。このブラウザの中だけに残ります。
   ============================================================ */
var KEY = "hachimitsu-shukei-v1";
var MIDS = ["あじさい","ひまわり","たんぽぽ","すずらん","なでしこ","こすもす","しらかば","くちなし",
            "さざんか","やまぶき","つゆくさ","からまつ","あさがお","はまなす","わかくさ","にじいろ",
            "ほしぞら","おおぞら","みずいろ","ゆきやま"];

function blank(){ return { members:[], logs:[], aliases:{}, prize:35000, from:"", to:"" }; }
var S = loadData();

function loadData(){
  try{
    var r = JSON.parse(localStorage.getItem(KEY) || "null");
    if (r && Array.isArray(r.members)){
      var b = blank();
      for (var k in b) if (!(k in r)) r[k] = b[k];
      if (!r.aliases || typeof r.aliases !== "object") r.aliases = {};
      if (!Array.isArray(r.logs)) r.logs = [];
      /* 端末番号つきの古いデータを読んでも落ちないように均す */
      r.members.forEach(function(m){ delete m.devices; });
      r.logs.forEach(function(l){ delete l.dev; });
      for (var a in r.aliases) if (r.aliases[a] && typeof r.aliases[a] === "object") r.aliases[a] = r.aliases[a].mid;
      return r;
    }
  }catch(e){}
  return blank();
}
function save(){
  S.updated = new Date().toISOString();
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ toast("保存できませんでした"); }
}

/* ---------------- 小道具 ---------------- */
function $(s){ return document.querySelector(s); }
function $$(s){ return Array.prototype.slice.call(document.querySelectorAll(s)); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function pad2(n){ return ("0"+n).slice(-2); }
function today(){ var d=new Date(); return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function yen(n){ return Number(n||0).toLocaleString("ja-JP"); }
var toastTimer;
function toast(m){
  var t=$("#toast"); t.textContent=m; t.classList.add("on");
  clearTimeout(toastTimer); toastTimer=setTimeout(function(){ t.classList.remove("on"); },1900);
}
function chars(s){ return Array.from(String(s||"")); }

/* 伏字の形。TikTokは先頭2＋末尾2（短い名前だと1文字）しか見せない */
function mask(name){
  var c = chars((name||"").trim());
  if (c.length < 3) return c.join("");
  var n = c.length >= 6 ? 2 : 1;
  return c.slice(0,n).join("") + "***" + c.slice(c.length-n).join("");
}
/* 照合用に記号・絵文字を落とす */
function keyOf(s){ return String(s||"").replace(/[^0-9A-Za-z぀-ヿ一-鿿]/g,"").toUpperCase(); }

/* つけてもらうアカウント名。今の名前をコードではさむ */
function acct(m){ return m.code + m.mid + m.code; }
function findMember(id){ return S.members.filter(function(m){ return m.id===id; })[0]; }
function memberLabel(id){ var m=findMember(id); return m ? m.name : "(削除ずみ)"; }

/* ============================================================
   名簿
   ============================================================ */
function nextCode(name){
  var head = chars(name)[0] || "";
  var map = {"あ":"A","い":"A","う":"A","え":"A","お":"A","か":"K","き":"K","く":"K","け":"K","こ":"K",
    "さ":"S","し":"S","す":"S","せ":"S","そ":"S","た":"T","ち":"T","つ":"T","て":"T","と":"T",
    "な":"N","に":"N","ぬ":"N","ね":"N","の":"N","は":"H","ひ":"H","ふ":"H","へ":"H","ほ":"H",
    "ま":"M","み":"M","む":"M","め":"M","も":"M","や":"Y","ゆ":"Y","よ":"Y",
    "ら":"R","り":"R","る":"R","れ":"R","ろ":"R","わ":"W","を":"W",
    "が":"G","ぎ":"G","ぐ":"G","げ":"G","ご":"G","ざ":"Z","じ":"Z","ず":"Z","ぜ":"Z","ぞ":"Z",
    "だ":"D","ぢ":"D","づ":"D","で":"D","ど":"D","ば":"B","び":"B","ぶ":"B","べ":"B","ぼ":"B",
    "ぱ":"P","ぴ":"P","ぷ":"P","ぺ":"P","ぽ":"P"};
  var kana = head.replace(/[ァ-ヶ]/g, function(c){ return String.fromCharCode(c.charCodeAt(0)-0x60); });
  var letter = /^[A-Za-z]$/.test(head) ? head.toUpperCase() : (map[kana] || "X");
  for (var i=1;i<10;i++){
    var c = letter + i;
    if (!S.members.some(function(m){ return m.code.toUpperCase()===c; })) return c;
  }
  return letter + "9";
}

function addMember(){
  var name = $("#newName").value.trim();
  var code = $("#newCode").value.trim().toUpperCase();
  var mid  = $("#newMid").value.trim();
  if (!name){ toast("会員名を入れてください"); return; }
  if (!code) code = nextCode(name);
  if (!/^[0-9A-Z]{2}$/.test(code)){ toast("コードは英数字2文字にしてください"); return; }
  if (S.members.some(function(m){ return m.code.toUpperCase()===code; })){ toast("そのコードは使われています"); return; }
  if (!mid) mid = MIDS[S.members.length % MIDS.length];
  if (chars(mid).length < 4){ toast("まんなかの文字は4文字以上にしてください"); return; }

  S.members.push({ id:"m"+Date.now()+Math.floor(Math.random()*1000), name:name, code:code, mid:mid });
  save();
  $("#newName").value=""; $("#newCode").value=""; $("#newMid").value="";
  renderAll(); toast(name+"さんを追加しました");
}

/* 直近30日に出た＋40の回数。＋40は同じ端末で30日に1回しか取れないので、
   この数字がそのまま「その人が出した新しい端末の数」になる */
function recent40(){
  var limit = new Date(); limit.setDate(limit.getDate()-29);
  var from = limit.getFullYear()+"-"+pad2(limit.getMonth()+1)+"-"+pad2(limit.getDate());
  var out = {};
  S.logs.forEach(function(l){
    if (l.honey < 40 || l.date < from) return;
    out[l.mid] = (out[l.mid]||0) + 1;
  });
  return out;
}

function renderRoster(){
  var box = $("#roster");
  if (!S.members.length){ box.innerHTML = '<div class="empty">まだ誰も登録されていません。</div>'; renderCollide(); return; }
  var r40 = recent40();
  box.innerHTML = S.members.map(function(m){
    var nm = acct(m);
    var n  = r40[m.id] || 0;
    return '<div class="card" data-m="'+m.id+'">'
      + '<div class="mhead"><span class="tag">'+esc(m.code)+'</span><b>'+esc(m.name)+'</b>'
      + '<span style="flex:1"></span>'
      + '<button class="btn sm danger" data-delm="'+m.id+'">削除</button></div>'
      + '<div class="mname"><span class="code">'+esc(nm)+'</span> → <b class="mono">'+esc(mask(nm))+'</b></div>'
      + '<div class="mstat">直近30日の ＋40 … <b>'+n+'回</b>'
      + (n ? '（この人が出した新しい端末の数）' : '（まだありません）') + '</div>'
      + '</div>';
  }).join("");
  renderCollide();
}

function renderCollide(){
  var seen = {}, bad = [];
  S.members.forEach(function(m){
    var k = keyOf(mask(acct(m)));
    if (seen[k]) bad.push(seen[k] + " と " + m.name + "さん");
    else seen[k] = m.name + "さん";
  });
  $("#collide").innerHTML = bad.length
    ? '<div class="note ng"><b>伏字がかぶっています</b>'+esc(bad.join(" ／ "))+'<br>どちらかのコードを変えてください。</div>'
    : "";
}

function noticeText(){
  var out = ["【TikTok Lite アカウント名の変更をお願いします】","",
    "ハチミツの集計のために、アカウント名（ニックネーム）を下の通りに変更してください。",
    "履歴には先頭2文字と末尾2文字しか出ないので、ここを揃えると誰が踏んだか分かるようになります。",
    "端末が何台あっても、ぜんぶ同じ名前で大丈夫です。",""];
  S.members.forEach(function(m){
    out.push("■ "+m.name+"さん　→　"+acct(m)+"　（履歴では "+mask(acct(m))+" と出ます）");
  });
  out.push("", "変更のしかた：プロフィール → プロフィールを編集 → ニックネーム");
  return out.join("\n");
}

/* ============================================================
   読み取り（貼り付けたログを記録に変える）
   ============================================================ */
function parseText(text){
  var lines = String(text||"").split(/\r?\n/).map(function(s){ return s.trim(); }).filter(Boolean);
  var recs = [], cur = null;
  var reDate = /(\d{4})\s*年\s*(\d{1,2})\s*月\s*(\d{1,2})\s*日[\s　]*(\d{1,2}):(\d{2})(?::(\d{2}))?/;
  var reMask = /([^\s:：　]*?)\*{2,}\s?([^\s:：　]*)/;
  var reHoney = /\+\s*(\d+)/;

  function push(){ if (cur && cur.masked) recs.push(cur); cur = null; }

  lines.forEach(function(ln){
    var mm = ln.match(reMask);
    if (mm){
      push();
      var head = mm[1], tail = mm[2].replace(/さん$/,"");
      cur = { masked: head+"***"+tail, head: head, tail: tail,
              kind: /既存/.test(ln) ? "old" : (/今日アプリ|使っていない/.test(ln) ? "new" : ""),
              date:"", time:"", honey:0 };
    }
    var dm = ln.match(reDate);
    if (dm && cur){
      cur.date = dm[1]+"-"+pad2(dm[2])+"-"+pad2(dm[3]);
      cur.time = pad2(dm[4])+":"+dm[5]+":"+(dm[6]||"00");
    }
    var hm = ln.match(reHoney);
    if (hm && cur && !cur.honey) cur.honey = parseInt(hm[1],10);
  });
  push();

  recs.forEach(function(r){
    if (!r.honey) r.honey = r.kind==="old" ? 5 : 40;
    if (!r.kind)  r.kind  = r.honey >= 40 ? "new" : "old";
    if (!r.date)  r.date  = today();
    r.mid = matchRec(r) || "";
  });
  markDups(recs);
  return recs;
}

function matchRec(r){
  var k = keyOf(r.masked);
  /* ① 登録した名前の伏字とぴったり合うか */
  for (var i=0;i<S.members.length;i++){
    if (keyOf(mask(acct(S.members[i]))) === k) return S.members[i].id;
  }
  /* ② 先頭の会員コードだけで合わせる（末尾が何であっても拾える） */
  var head = String(r.head||"").replace(/[^0-9A-Za-z]/g,"").toUpperCase();
  if (head.length >= 2){
    var hit = S.members.filter(function(m){ return m.code.toUpperCase() === head.slice(0,2); })[0];
    if (hit) return hit.id;
  }
  /* ③ 前に手で結びつけた名前（改名前の端末はこれで拾える） */
  var a = S.aliases[k];
  if (a && findMember(a)) return a;
  return "";
}

/* 同じ日時・同じ会員の記録が、すでに入っている数より多い分だけを「新しい」とみなす。
   同じ秒に2台から踏まれても取りこぼさず、スクショを貼り直しても二重に数えない。 */
function markDups(recs){
  var seen = {};
  recs.forEach(function(r){
    if (!r.mid){ r.dup = false; return; }
    var k = r.date+"|"+r.time+"|"+r.mid;
    seen[k] = (seen[k]||0) + 1;
    var have = S.logs.filter(function(l){
      return l.date===r.date && l.time===r.time && l.mid===r.mid; }).length;
    r.dup = seen[k] <= have;
  });
}

var parsed = [];
function renderParse(){
  var box = $("#parseOut");
  if (!parsed.length){ box.innerHTML=""; return; }
  var opts = ['<option value="">— 選んでください —</option>'].concat(
    S.members.map(function(m){ return '<option value="'+m.id+'">'+esc(m.name)+'</option>'; })).join("");
  var ok = parsed.filter(function(r){ return r.mid && !r.dup; }).length;
  var ng = parsed.filter(function(r){ return !r.mid; }).length;
  var du = parsed.filter(function(r){ return r.dup; }).length;

  var rows = parsed.map(function(r,i){
    var who;
    if (r.dup) who = '<span class="tag">入力ずみ</span>';
    else if (r.mid) who = '<span class="tag ok">'+esc(memberLabel(r.mid))+'</span>';
    else who = '<select data-assign="'+i+'">'+opts+'</select>';
    return '<tr><td class="mono">'+esc(r.date)+'<br><span style="color:var(--ink-dim)">'+esc(r.time)+'</span></td>'
      + '<td class="mono">'+esc(r.masked)+'</td>'
      + '<td class="n">+'+r.honey+'</td>'
      + '<td>'+who+'</td></tr>';
  }).join("");

  box.innerHTML = '<div class="card">'
    + '<div class="row" style="margin-bottom:8px"><b>読み取り結果 '+parsed.length+'件</b>'
    + '<span class="tag ok">取り込める '+ok+'</span>'
    + (du?'<span class="tag">重複 '+du+'</span>':'')
    + (ng?'<span class="tag ng">未登録 '+ng+'</span>':'')+'</div>'
    + (ng?'<div class="note warn" style="margin:0 0 10px"><b>未登録の名前があります</b>右の欄で誰か選ぶと、次回から自動で分かるようになります。</div>':'')
    + '<table><thead><tr><th>日時</th><th>表示名</th><th class="n">ハチミツ</th><th>誰が踏んだか</th></tr></thead><tbody>'
    + rows + '</tbody></table>'
    + '<div class="row" style="margin-top:12px">'
    + '<button class="btn primary" id="commit">'+ok+'件を取り込む</button>'
    + '<button class="btn" id="dropParse">やめる</button></div></div>';
}

function commitParsed(){
  var n = 0;
  parsed.forEach(function(r){
    if (!r.mid || r.dup) return;
    S.logs.push({ date:r.date, time:r.time, mid:r.mid, honey:r.honey, kind:r.kind, masked:r.masked });
    n++;
  });
  S.logs.sort(function(a,b){ return (b.date+b.time).localeCompare(a.date+a.time); });
  parsed = []; save(); renderAll(); $("#parseOut").innerHTML="";
  toast(n+"件を取り込みました");
}

/* ============================================================
   集計
   ============================================================ */
function inRange(l){
  var f = $("#fDate").value, t = $("#tDate").value;
  if (f && l.date < f) return false;
  if (t && l.date > t) return false;
  return true;
}

function tally(){
  var by = {}, total = 0;
  S.logs.filter(inRange).forEach(function(l){
    var r = by[l.mid] || (by[l.mid] = { mid:l.mid, n40:0, n5:0, honey:0 });
    if (l.honey >= 40) r.n40++; else r.n5++;
    r.honey += l.honey; total += l.honey;
  });
  var list = Object.keys(by).map(function(k){ return by[k]; });
  list.sort(function(a,b){ return b.honey - a.honey; });
  return { list:list, total:total };
}

function renderTotal(){
  var r = tally();
  $("#totalLead").textContent = S.logs.length
    ? "記録は全部で"+S.logs.length+"件、いちばん新しいのは "+S.logs[0].date+" です。"
    : "まだ記録がありません。「入力」タブから入れてください。";

  if (!r.list.length){ $("#totalOut").innerHTML = '<div class="empty">この期間の記録はありません。</div>'; renderDaily(); return; }
  var max = r.list[0].honey || 1;
  var rows = r.list.map(function(x){
    var pct = r.total ? (x.honey / r.total * 100) : 0;
    return '<tr><td>'+esc(memberLabel(x.mid))+'</td>'
      + '<td class="n">'+x.n40+'</td><td class="n">'+x.n5+'</td>'
      + '<td class="n">'+yen(x.honey)+'</td>'
      + '<td style="width:34%"><div class="bar-fill" style="width:'+(x.honey/max*100)+'%"></div>'
      + '<span class="mono" style="font-size:11px;color:var(--ink-dim)">'+pct.toFixed(1)+'%</span></td></tr>';
  }).join("");
  $("#totalOut").innerHTML = '<div class="card"><table>'
    + '<thead><tr><th>会員</th><th class="n">+40</th><th class="n">+5</th><th class="n">ハチミツ</th><th>割合</th></tr></thead>'
    + '<tbody>'+rows+'<tr class="total"><td>合計</td>'
    + '<td class="n">'+r.list.reduce(function(a,x){return a+x.n40;},0)+'</td>'
    + '<td class="n">'+r.list.reduce(function(a,x){return a+x.n5;},0)+'</td>'
    + '<td class="n">'+yen(r.total)+'</td><td></td></tr></tbody></table></div>';

  renderDaily();
}

/* 日ごとの集計。縦が日付、横が会員のクロス表。
   dailyMode が "honey" ならハチミツ数、"count" なら踏んだ回数を出す。 */
var dailyMode = "honey";

function dailyData(){
  var cell = {}, days = {};
  S.logs.filter(inRange).forEach(function(l){
    days[l.date] = 1;
    var k = l.date+"|"+l.mid;
    var c = cell[k] || (cell[k] = { honey:0, n:0 });
    c.honey += l.honey; c.n++;
  });
  return { cell:cell, days:Object.keys(days).sort().reverse() };
}

function renderDaily(){
  var t = tally();
  if (!t.list.length){ $("#dailyOut").innerHTML = '<div class="empty">この期間の記録はありません。</div>'; return; }
  var d = dailyData(), ms = t.list;
  var val = function(day, mid){
    var c = d.cell[day+"|"+mid];
    return c ? (dailyMode==="honey" ? c.honey : c.n) : 0;
  };

  var head = '<tr><th>日付</th>'
    + ms.map(function(x){ return '<th class="n">'+esc(memberLabel(x.mid))+'</th>'; }).join("")
    + '<th class="n">合計</th></tr>';

  var body = d.days.map(function(day){
    var sum = 0;
    var tds = ms.map(function(x){
      var v = val(day, x.mid); sum += v;
      return '<td class="n">'+(v ? yen(v) : '<span class="dim">·</span>')+'</td>';
    }).join("");
    return '<tr><td class="mono">'+esc(day)+'</td>'+tds+'<td class="n"><b>'+yen(sum)+'</b></td></tr>';
  }).join("");

  var gsum = 0;
  var foot = '<tr class="total"><td>合計</td>'
    + ms.map(function(x){
        var v = dailyMode==="honey" ? x.honey : (x.n40 + x.n5);
        gsum += v;
        return '<td class="n">'+yen(v)+'</td>';
      }).join("")
    + '<td class="n">'+yen(gsum)+'</td></tr>';

  $("#dailyOut").innerHTML = '<div class="card"><div class="tscroll"><table>'
    + '<thead>'+head+'</thead><tbody>'+body+foot+'</tbody></table></div>'
    + '<p class="lead" style="margin:10px 0 0">'
    + (dailyMode==="honey" ? 'ハチミツの数です。' : '踏んでもらった回数です。＋40と＋5をまとめて数えています。')
    + ' 会員が多いときは表を横にスクロールしてください。</p></div>';
}

function renderShare(){
  var r = tally(), prize = Number($("#prize").value) || 0;
  if (!r.list.length || !r.total){ $("#shareOut").innerHTML = '<div class="empty">この期間の記録はありません。</div>'; return; }
  var sum = 0;
  var rows = r.list.map(function(x){
    var amt = Math.floor(prize * x.honey / r.total / 10) * 10;
    sum += amt;
    return '<tr><td>'+esc(memberLabel(x.mid))+'</td>'
      + '<td class="n">'+yen(x.honey)+'</td>'
      + '<td class="n">'+(x.honey/r.total*100).toFixed(1)+'%</td>'
      + '<td class="n"><b>'+yen(amt)+'円</b></td></tr>';
  }).join("");
  $("#shareOut").innerHTML = '<div class="card"><table>'
    + '<thead><tr><th>会員</th><th class="n">ハチミツ</th><th class="n">割合</th><th class="n">取り分</th></tr></thead>'
    + '<tbody>'+rows+'<tr class="total"><td>合計</td><td class="n">'+yen(r.total)+'</td><td class="n"></td>'
    + '<td class="n">'+yen(sum)+'円</td></tr></tbody></table>'
    + '<p class="lead" style="margin:10px 0 0">10円未満は切り捨てています。余りの '
    + yen(prize - sum) + '円 は幹事預かりなどで調整してください。</p></div>';
}

function renderRecent(){
  var box = $("#recent");
  if (!S.logs.length){ box.innerHTML = '<div class="empty">まだ記録がありません。</div>'; return; }
  box.innerHTML = '<div class="card"><table><thead><tr><th>日付</th><th>会員</th><th class="n">ハチミツ</th><th></th></tr></thead><tbody>'
    + S.logs.slice(0,30).map(function(l,i){
      return '<tr><td class="mono">'+esc(l.date)+' <span style="color:var(--ink-dim)">'+esc(l.time||"")+'</span></td>'
        + '<td>'+esc(memberLabel(l.mid))+'</td>'
        + '<td class="n">+'+l.honey+'</td>'
        + '<td class="n"><button class="btn sm danger" data-dellog="'+i+'">消す</button></td></tr>';
    }).join("") + '</tbody></table>'
    + (S.logs.length>30 ? '<p class="lead" style="margin:10px 0 0">新しい30件だけ出しています（全'+S.logs.length+'件）。</p>' : '')
    + '</div>';
}

function renderWhoSelect(){
  var sel = $("#mWho"), cur = sel.value;
  sel.innerHTML = S.members.map(function(m){
    return '<option value="'+m.id+'">'+esc(m.name)+'（'+esc(mask(acct(m)))+'）</option>';
  }).join("") || '<option value="">先に名簿へ会員を登録してください</option>';
  if (cur) sel.value = cur;
}

function renderAll(){
  renderRoster(); renderWhoSelect(); renderRecent(); renderTotal(); renderShare();
  $("#ver").textContent = S.logs.length + "件";
}

$$(".tabbar button").forEach(function(b){
  b.addEventListener("click", function(){
    $$(".tabbar button").forEach(function(x){ x.classList.remove("on"); });
    $$(".tab").forEach(function(x){ x.classList.remove("on"); });
    b.classList.add("on"); $("#"+b.dataset.tab).classList.add("on");
    window.scrollTo(0,0);
  });
});
$("#theme").addEventListener("click", function(){
  var cur = document.documentElement.getAttribute("data-theme");
  var next = cur==="dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try{ localStorage.setItem("shukei-theme", next); }catch(e){}
});
try{ var th=localStorage.getItem("shukei-theme"); if(th) document.documentElement.setAttribute("data-theme",th); }catch(e){}

$("#addMember").addEventListener("click", addMember);
$("#newName").addEventListener("blur", function(){
  if (!$("#newCode").value.trim() && this.value.trim()) $("#newCode").value = nextCode(this.value.trim());
  if (!$("#newMid").value.trim()) $("#newMid").value = MIDS[S.members.length % MIDS.length];
});

$("#roster").addEventListener("click", function(e){
  var del = e.target.closest("[data-delm]");
  if (!del) return;
  var m = findMember(del.dataset.delm);
  if (!m) return;
  if (!confirm(m.name+"さんを名簿から消します。記録は残りますが誰のものか分からなくなります。よろしいですか？")) return;
  S.members = S.members.filter(function(x){ return x.id!==m.id; });
  save(); renderAll(); toast("削除しました");
});

$("#showNotice").addEventListener("click", function(){
  var b = $("#noticeBox");
  b.textContent = noticeText();
  b.style.display = b.style.display==="none" ? "block" : "none";
});
$("#copyNotice").addEventListener("click", function(){
  if (!S.members.length){ toast("先に会員を登録してください"); return; }
  copy(noticeText(), "文面をコピーしました");
});
function copy(text, msg){
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ toast(msg); },
      function(){ fallbackCopy(text, msg); });
  } else fallbackCopy(text, msg);
}
function fallbackCopy(text, msg){
  var ta=document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); toast(msg); }catch(e){ toast("コピーできませんでした"); }
  document.body.removeChild(ta);
}

/* ---------------- 書き出し・読み込み ---------------- */
function download(name, text, type){
  var blob = new Blob([text], { type: type||"text/plain;charset=utf-8" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); document.body.removeChild(a); }, 500);
}
$("#expJson").addEventListener("click", function(){
  download("ハチミツ集計_"+today()+".json", JSON.stringify(S,null,2), "application/json");
  toast("書き出しました");
});
$("#impJson").addEventListener("click", function(){ $("#impFile").click(); });
$("#impFile").addEventListener("change", function(){
  var f = this.files[0]; if (!f) return;
  var rd = new FileReader();
  rd.onload = function(){
    try{
      var r = JSON.parse(rd.result);
      if (!r || !Array.isArray(r.members)) throw new Error("形式が違います");
      if (!confirm("いまのデータを置き換えます。よろしいですか？")) return;
      r.members.forEach(function(m){ delete m.devices; });
      (r.logs||[]).forEach(function(l){ delete l.dev; });
      for (var a in (r.aliases||{})) if (r.aliases[a] && typeof r.aliases[a]==="object") r.aliases[a] = r.aliases[a].mid;
      S = Object.assign(blank(), r); save(); applyState(); renderAll(); toast("読み込みました");
    }catch(e){ toast("読み込めませんでした"); }
  };
  rd.readAsText(f); this.value="";
});
$("#expCsv").addEventListener("click", function(){
  var r = tally();
  var rows = [["会員","＋40の回数","＋5の回数","ハチミツ合計","割合%"]];
  r.list.forEach(function(x){
    rows.push([memberLabel(x.mid), x.n40, x.n5, x.honey, (x.honey/r.total*100).toFixed(1)]);
  });
  rows.push(["合計","","",r.total,"100.0"]);

  var d = dailyData();
  [["日ごとのハチミツ数","honey"], ["日ごとの回数","n"]].forEach(function(sec){
    rows.push([]);
    rows.push([sec[0]]);
    rows.push(["日付"].concat(r.list.map(function(x){ return memberLabel(x.mid); })).concat(["合計"]));
    d.days.forEach(function(day){
      var sum = 0;
      var line = [day].concat(r.list.map(function(x){
        var c = d.cell[day+"|"+x.mid], v = c ? c[sec[1]] : 0;
        sum += v; return v;
      }));
      line.push(sum); rows.push(line);
    });
  });

  var csv = "﻿" + rows.map(function(a){
    return a.map(function(c){ return '"'+String(c).replace(/"/g,'""')+'"'; }).join(",");
  }).join("\r\n");
  download("ハチミツ集計_"+today()+".csv", csv, "text/csv;charset=utf-8");
  toast("CSVを保存しました");
});

(function(){
  var inp=document.getElementById('pw'), btn=document.getElementById('go'), er=document.getElementById('er');
  var opening=false;
  async function tryPw(pw, remember){
    if(opening) return;
    opening=true; btn.disabled=true;
    er.hidden=true; btn.textContent='開いています…';
    try{ await unlock(pw); if(remember){ try{ localStorage.setItem('tl-pw',pw); }catch(e){} } }
    catch(e){ btn.textContent='開く'; er.hidden=false; inp.value=''; inp.focus();
      try{ localStorage.removeItem('tl-pw'); }catch(x){} }
    finally{ opening=false; btn.disabled=false; }
  }
  btn.onclick=function(){ tryPw(inp.value.replace(/[【】\s]/g,'').toLowerCase(), true); };
  inp.addEventListener('keydown',function(e){ if(e.key==='Enter') btn.click(); });
  var saved=null; try{ saved=localStorage.getItem('tl-pw'); }catch(e){}
  if(saved) tryPw(saved,false); else inp.focus();
})();
</script></body></html>
